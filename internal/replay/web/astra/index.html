function initEditMode() {
  document.body.classList.add('editing');
  if (!lastGsi) renderDemo();
  if (!$('clutch-ct').firstChild) renderClutchCard('CT', clutchDemoPlayer('CT'));
  if (!$('clutch-t').firstChild) renderClutchCard('T', clutchDemoPlayer('T'));
  const banner = $('roundbanner');
  banner.textContent = 'CT WIN';
  banner.className = 'show ct';

  let drag = null;
  let selected = [];
  const paintSel = () => {
    document.querySelectorAll('.editable.selected').forEach(x => x.classList.remove('selected'));
    selected.forEach(x => x.classList.add('selected'));
  };
  const select = (el, additive) => {
    if (additive) {
      selected = selected.includes(el) ? selected.filter(x => x !== el) : selected.concat(el);
    } else {
      selected = [el];
    }
    paintSel();
  };
  // --- snap-on-drag: candidate lines (screen center/edges + every other part's
  // edges and centers); shows guide lines while snapped ---
  const guideV = document.createElement('div'); guideV.className = 'snap-guide v';
  const guideH = document.createElement('div'); guideH.className = 'snap-guide h';
  $('hud').appendChild(guideV); $('hud').appendChild(guideH);
  const hideGuides = () => { guideV.style.display = 'none'; guideH.style.display = 'none'; };
  const SNAP_T = 10;
  function snapDrag(el, x, y) {
    const r = designRect(el);
    const w = r.w, h = r.h;
    const xLines = [0, 960, 1920], yLines = [0, 540, 1080];
    EDITABLE.forEach(id => {
      const o = $(id);
      if (!o || o === el) return;
      const or = designRect(o);
      if (or.w <= 0 || or.h <= 0) return;
      xLines.push(or.x, or.x + or.w / 2, or.x + or.w);
      yLines.push(or.y, or.y + or.h / 2, or.y + or.h);
    });
    let bx = null, by = null;
    for (const L of xLines) for (const off of [0, w / 2, w]) {
      const d = L - off - x;
      if (Math.abs(d) <= SNAP_T && (!bx || Math.abs(d) < Math.abs(bx.d))) bx = { d, L };
    }
    for (const L of yLines) for (const off of [0, h / 2, h]) {
      const d = L - off - y;
      if (Math.abs(d) <= SNAP_T && (!by || Math.abs(d) < Math.abs(by.d))) by = { d, L };
    }
    if (bx) { x += bx.d; guideV.style.left = bx.L + 'px'; guideV.style.display = 'block'; } else guideV.style.display = 'none';
    if (by) { y += by.d; guideH.style.top = by.L + 'px'; guideH.style.display = 'block'; } else guideH.style.display = 'none';
    return { x: Math.round(x), y: Math.round(y) };
  }

  EDITABLE.forEach(id => {
    const el = $(id);
    if (!el) return;
    el.classList.add('editable');
    el.style.pointerEvents = 'auto';
    const rz = document.createElement('div');
    rz.className = 'rz';
    el.appendChild(rz);

    el.addEventListener('mousedown', e => {
      if (e.target === rz) return;
      e.preventDefault();
      select(el, e.shiftKey);
      normalizeEl(el);
      const hudRect = $('hud').getBoundingClientRect();
      const r = designRect(el);
      drag = {
        el, id, resize: false,
        offX: (e.clientX - hudRect.left) / hudScale - r.x,
        offY: (e.clientY - hudRect.top) / hudScale - r.y
      };
    });
    rz.addEventListener('mousedown', e => {
      e.preventDefault();
      e.stopPropagation();
      if (!selected.includes(el)) select(el, false);
      normalizeEl(el);
      const r = designRect(el);
      const cur = getLayout()[id];
      drag = { el, id, resize: true, startX: e.clientX, startW: r.w, startS: (cur && cur.s) || 1 };
    });
  });

  window.addEventListener('mousemove', e => {
    if (!drag) return;
    const hudRect = $('hud').getBoundingClientRect();
    const mx = (e.clientX - hudRect.left) / hudScale;
    const my = (e.clientY - hudRect.top) / hudScale;
    const layout = getLayout();
    const cur = layout[drag.id] || { x: parseFloat(drag.el.style.left) || 0, y: parseFloat(drag.el.style.top) || 0, s: 1 };
    if (drag.resize) {
      const dw = (e.clientX - drag.startX) / hudScale;
      cur.s = Math.round(Math.min(3, Math.max(0.3, drag.startS * (drag.startW + dw) / drag.startW)) * 100) / 100;
      drag.el.style.transform = 'scale(' + cur.s + ')';
    } else {
      const sn = snapDrag(drag.el, mx - drag.offX, my - drag.offY);
      cur.x = sn.x; cur.y = sn.y;
      drag.el.style.left = cur.x + 'px';
      drag.el.style.top = cur.y + 'px';
    }
    layout[drag.id] = cur;
    saveLayout(layout);
  });
  window.addEventListener('mouseup', () => { drag = null; hideGuides(); });

  $('tb-reset').onclick = () => {
    clearTimeout(layoutPostTimer);
    serverLayout = {};
    try { localStorage.removeItem(LAYOUT_KEY); } catch (e) {}
    // must await the POST before reloading, otherwise the reload kills the
    // debounced save and the server keeps the old layout ("reset does nothing")
    fetch('/api/hud-layout/' + HUD_ID, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}'
    }).catch(() => {}).then(() => location.reload());
  };
  $('tb-done').onclick = () => { window.close(); };

  // draggable + foldable toolbar so it never covers the parts being adjusted
  const tb = $('edit-toolbar');
  const TB_KEY = 'astra-hud-tb-pos';
  try {
    const p = JSON.parse(localStorage.getItem(TB_KEY) || 'null');
    if (p) { tb.style.left = p.x + 'px'; tb.style.top = p.y + 'px'; }
  } catch (e) {}
  let tbDrag = null;
  $('tb-drag').addEventListener('mousedown', e => {
    tbDrag = { ox: e.clientX - tb.offsetLeft, oy: e.clientY - tb.offsetTop };
    e.preventDefault();
    e.stopPropagation();
  });
  window.addEventListener('mousemove', e => {
    if (!tbDrag) return;
    const x = Math.max(0, Math.min(window.innerWidth - 80, e.clientX - tbDrag.ox));
    const y = Math.max(0, Math.min(window.innerHeight - 40, e.clientY - tbDrag.oy));
    tb.style.left = x + 'px'; tb.style.top = y + 'px';
    try { localStorage.setItem(TB_KEY, JSON.stringify({ x, y })); } catch (err) {}
  });
  window.addEventListener('mouseup', () => { tbDrag = null; });
  $('tb-fold').onclick = () => document.body.classList.add('tb-folded');
  $('edit-pill').onclick = () => document.body.classList.remove('tb-folded');
}

Promise.all([loadSprite(), loadServerLayout()]).then(() => {
  if (IS_RADAR) {
    // Radar-only view: ignore saved layout; center + fit radar in the actual window
    // (accounting for the #hud 16:9 letterbox via its on-screen rect)
    document.body.classList.add('radar-only');
    const fitRadar = () => {
      const hudRect = $('hud').getBoundingClientRect();
      if (!hudRect.width) return;
      const hs = hudRect.width / 1920; // #hud on-screen scale
      const target = Math.min(window.innerWidth, window.innerHeight) * 0.94; // desired screen px
      const s = target / (RADAR_SIZE * hs);
      const el = $('radar');
      el.style.transform = 'scale(' + s.toFixed(4) + ')';
      el.style.left = (((window.innerWidth - target) / 2) - hudRect.left) / hs + 'px';
      el.style.top = (((window.innerHeight - target) / 2) - hudRect.top) / hs + 'px';
    };
    fitRadar();
    window.addEventListener('resize', fitRadar);
  } else {
    applySavedLayout();
  }
  if (IS_EDIT) initEditMode();
});
connect();
</script>
</body>
</html>
