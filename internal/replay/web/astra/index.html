<!DOCTYPE html>
<html lang="en">
<head>
<script src="/astra/replay-bridge.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Astra Default HUD</title>
<style>
:root {
  /* Astra injectable colors (main app writes these on :root) */
  --astra-primary: #00F0FF;
  --astra-secondary: #FF9100;
  --astra-accent: #ffffff;
  --astra-text: #ffffff;
  /* Team colors follow the app's two-side colors */
  --ct: var(--astra-primary);
  --ct-deep: color-mix(in srgb, var(--astra-primary), black 45%);
  --t: var(--astra-secondary);
  --t-deep: color-mix(in srgb, var(--astra-secondary), black 45%);
  --bg-a: 1; /* black-panel opacity multiplier, set by the app's Background Opacity slider */
  --bg-panel: rgba(4, 6, 10, calc(0.92 * var(--bg-a)));
  --bg-panel-soft: rgba(4, 6, 10, calc(0.86 * var(--bg-a)));
  --border: rgba(255, 255, 255, 0.09);
  --dead: 0.32;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
@font-face {
  font-family: 'Rajdhani';
  src: url('assets/fonts/rajdhani-500.woff2') format('woff2');
  font-weight: 500; font-style: normal; font-display: swap;
}
@font-face {
  font-family: 'Rajdhani';
  src: url('assets/fonts/rajdhani-600.woff2') format('woff2');
  font-weight: 600; font-style: normal; font-display: swap;
}
@font-face {
  font-family: 'Rajdhani';
  src: url('assets/fonts/rajdhani-700.woff2') format('woff2');
  font-weight: 700; font-style: normal; font-display: swap;
}
html, body {
  width: 100%; height: 100%;
  background: transparent;
  overflow: hidden;
  font-family: "Rajdhani", "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
  color: var(--astra-text);
  -webkit-font-smoothing: antialiased;
}
#hud {
  width: 1920px; height: 1080px;
  position: relative;
  transform-origin: top left;
  font-family: "Rajdhani", "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
  font-variant-numeric: tabular-nums;
}
#hud * { font-family: inherit; }
.ico { width: 16px; height: 16px; fill: currentColor; vertical-align: middle; flex: none; }

/* ============ TOP BAR ============ */
#topbar {
  position: absolute; top: 18px; left: 50%; transform: translateX(-50%);
  display: flex; align-items: stretch;
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 4px 24px rgba(0,0,0,0.5), 0 0 12px rgba(0,240,255,0.06);
  backdrop-filter: blur(6px);
}
.tside { display: flex; align-items: center; gap: 10px; padding: 8px 14px; min-width: 250px; }
.tside.ct { border-left: 4px solid var(--ct); }
.tside.t { border-right: 4px solid var(--t); flex-direction: row-reverse; text-align: right; }
.tlogo {
  width: 44px; height: 44px; border-radius: 6px;
  background: rgba(255,255,255,0.18);
  display: flex; align-items: center; justify-content: center;
  overflow: hidden; flex: none;
}
.tlogo img { width: 100%; height: 100%; object-fit: contain; }
.tlogo .tinitial { font-size: 20px; font-weight: 800; letter-spacing: 1px; }
.tside.ct .tinitial { color: var(--ct); }
.tside.t .tinitial { color: var(--t); }
.tmeta { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tname { font-size: 17px; font-weight: 800; letter-spacing: 0.5px; white-space: nowrap; max-width: 150px; overflow: hidden; text-overflow: ellipsis; }
.tside.t .tname { margin-left: auto; }
.tseries { display: flex; gap: 4px; margin-top: 1px; min-height: 4px; }
.tside.t .tseries { justify-content: flex-end; }
.tseries span { width: 16px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.18); }
.tside.ct .tseries span.won { background: var(--ct); }
.tside.t .tseries span.won { background: var(--t); }
.tscore { font-size: 38px; font-weight: 800; line-height: 1; padding: 0 6px; font-variant-numeric: tabular-nums; }
.tside.ct .tscore { color: var(--ct); }
.tside.t .tscore { color: var(--t); }

#tcenter {
  position: relative; box-sizing: border-box;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 4px 22px; width: 232px; min-width: 232px;
  background: rgba(0,0,0,calc(0.58 * var(--bg-a)));
  border-left: 1px solid var(--border); border-right: 1px solid var(--border);
}
#timerrow { width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; }
/* event logo now sits inline next to the match name */
.evlogo { width: auto; height: 14px; max-width: 60px; object-fit: contain; flex: none; }
.evlogo-to { width: 240px; height: 88px; max-width: none; object-fit: contain; margin-bottom: 10px; }
#timerrow .ico { width: 20px; height: 20px; flex: none; }
#timer { width: 88px; flex: none; text-align: center; font-size: 32px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: 1px; }
#timerrow.phase-bomb { color: #ff4646; }
/* planted: the countdown text is replaced by a blinking red C4 icon */
.c4blink { display: inline-flex; color: #ff4646; animation: pulse-red 0.8s ease-in-out infinite; }
#timerrow .c4blink .ico { width: 32px; height: 32px; }
/* technical pause: countdown digits replaced by a soft-pulsing amber pause icon */
.techpause { display: inline-flex; color: #ffd94a; animation: pulse-red 1.6s ease-in-out infinite; }
#timerrow .techpause .ico { width: 32px; height: 32px; }
#timerrow.phase-defuse { color: var(--astra-primary); }
#timerrow.phase-freezetime { color: #dfe9f5; }
#timerrow.phase-timeout { color: #ffd94a; }
#timerrow.phase-over { color: var(--astra-accent); }
@keyframes pulse-red { 0%,100% { opacity: 1; } 50% { opacity: 0.55; } }
#roundlbl { font-size: 11px; font-weight: 700; letter-spacing: 2.5px; color: rgba(255,255,255,0.72); margin-top: 1px; }
#matchlbl {
  display: flex; align-items: center; justify-content: center; gap: 6px;
  font-size: 10px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
  color: var(--astra-primary); opacity: 0.9; margin-top: 2px;
  max-width: 210px; white-space: nowrap; overflow: hidden;
}
#matchlbl #matchname { overflow: hidden; text-overflow: ellipsis; }
#matchlbl.empty { display: none; }

/* ============ MAPS STRIP ============ */
#mapstrip {
  position: absolute; top: 18px; left: 18px;
  display: flex; gap: 6px; align-items: center;
}
.mapchip {
  font-size: 11px; font-weight: 700; letter-spacing: 1px;
  padding: 3px 10px; border-radius: 4px;
  background: var(--bg-panel-soft); border: 1px solid var(--border);
  color: #fff; text-transform: uppercase;
  display: flex; align-items: center; gap: 5px;
}
.mapchip.current { border-color: var(--astra-primary); color: #fff; box-shadow: 0 0 8px rgba(0,240,255,0.25); }
.mapchip .pickby { font-size: 9px; color: rgba(255,255,255,0.85); }
.mapchip .wteam {
  width: 15px; height: 15px; border-radius: 3px; overflow: hidden; flex: none;
  background: rgba(255,255,255,0.18);
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 8px; font-weight: 800; color: #fff; letter-spacing: 0;
}
.mapchip .wteam img { width: 100%; height: 100%; object-fit: contain; }

/* ============ PLAYER PANELS (BLAST-style: the card itself is the HP bar) ============ */
.players {
  position: absolute; bottom: 24px;
  display: flex; flex-direction: column; gap: 8px; width: 336px;
}
#players-left { left: 18px; }
#players-right { right: 18px; }
/* clutch spotlight (side layout): last-alive player's card, same look as the observed
   card but smaller; only the clutching team's column hides (plus the observed card).
   All show/hide is animated (fade + slide) — no hard display switches */
.players, #obsplayer { transition: opacity 0.25s ease, visibility 0s; }
.clutch {
  position: absolute; bottom: 110px; width: 380px; height: 58px; z-index: 5;
  opacity: 0; visibility: hidden; transform: translateY(14px);
  transition: opacity 0.25s ease, transform 0.25s ease, visibility 0s linear 0.25s;
}
#clutch-ct { right: calc(50% + 30px); }
#clutch-t { left: calc(50% + 30px); }
/* square-card (bottom) layout: team rows fade out during clutch, so the card can
   sit low in the freed space instead of floating above the rows */
body.layout-bottom .clutch { bottom: 100px; }
body.clutch-ct-on:not(.editing) #clutch-ct,
body.clutch-t-on:not(.editing) #clutch-t {
  opacity: 1; visibility: visible; transform: none;
  transition: opacity 0.25s ease, transform 0.25s ease, visibility 0s;
}
body.clutch-ct-on:not(.editing) #players-left,
body.clutch-t-on:not(.editing) #players-right,
body.clutch-ct-on:not(.editing) #obsplayer,
body.clutch-t-on:not(.editing) #obsplayer {
  opacity: 0; visibility: hidden; pointer-events: none;
  transition: opacity 0.25s ease, visibility 0s linear 0.25s;
}
.clutch .op-hp { font-size: 28px; width: 48px; }
.clutch .opavatar { width: 98px; height: 132px; }
.prow {
  position: relative; height: 72px; overflow: hidden;
  background: rgba(4, 6, 10, calc(0.9 * var(--bg-a)));
  border: 1px solid var(--border);
  border-radius: 8px;
  backdrop-filter: blur(4px);
  transition: opacity 0.3s;
}
/* signature color arc on the outer edge; brightens when this player is observed */
.prow::before {
  content: ''; position: absolute; top: 6px; bottom: 6px; width: 4px; border-radius: 4px; z-index: 1;
}
.players.ct .prow::before { left: 0; background: var(--ct-deep); }
.players.t .prow::before { right: 0; background: var(--t-deep); }
.players.ct .prow.observed::before { background: var(--ct); box-shadow: 0 0 8px var(--ct); }
.players.t .prow.observed::before { background: var(--t); box-shadow: 0 0 8px var(--t); }
/* hp fill: team-color layer with wave dot-matrix texture, width = hp% (drains from outer edge) */
.pfill { position: absolute; top: 0; bottom: 0; left: 0; width: 100%; transition: width 0.25s ease; overflow: hidden; }
.pfill::after {
  content: ''; position: absolute; inset: 0;
  background-image: radial-gradient(circle, rgba(255,255,255,0.14) 1px, transparent 1.7px);
  background-size: 7px 7px;
  -webkit-mask-image: repeating-linear-gradient(155deg, #000 0 24%, rgba(0,0,0,0.05) 42%, #000 58%, rgba(0,0,0,0.05) 76%, #000 94%);
  mask-image: repeating-linear-gradient(155deg, #000 0 24%, rgba(0,0,0,0.05) 42%, #000 58%, rgba(0,0,0,0.05) 76%, #000 94%);
}
.players.t .pfill::after {
  -webkit-mask-image: repeating-linear-gradient(25deg, #000 0 24%, rgba(0,0,0,0.05) 42%, #000 58%, rgba(0,0,0,0.05) 76%, #000 94%);
  mask-image: repeating-linear-gradient(25deg, #000 0 24%, rgba(0,0,0,0.05) 42%, #000 58%, rgba(0,0,0,0.05) 76%, #000 94%);
}
.players.ct .pfill, #obsplayer.ct .pfill { background: linear-gradient(180deg, color-mix(in srgb, var(--ct), #000 52%), color-mix(in srgb, var(--ct), #000 70%)); }
.players.t .pfill { left: auto; right: 0; background: linear-gradient(180deg, color-mix(in srgb, var(--t), #000 48%), color-mix(in srgb, var(--t), #000 66%)); }
/* observed card: hp fill always left-anchored regardless of side */
#obsplayer.t .pfill { background: linear-gradient(180deg, color-mix(in srgb, var(--t), #000 48%), color-mix(in srgb, var(--t), #000 66%)); }
.prow.low .pfill, #obsplayer.low .pfill { background: linear-gradient(180deg, #b03030, #7e1f1f) !important; }
/* slanted slot tab on the outer top corner */
.pslot {
  position: absolute; top: 0; z-index: 3;
  min-width: 28px; height: 17px; padding: 0 9px;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 800; color: #06121a; font-variant-numeric: tabular-nums;
}
.players.ct .pslot { left: 0; background: var(--ct); clip-path: polygon(0 0, 100% 0, 76% 100%, 0 100%); padding-right: 13px; }
.players.t .pslot { right: 0; background: var(--t); clip-path: polygon(24% 0, 100% 0, 100% 100%, 0 100%); padding-left: 13px; }
/* round-kills badge: angled neon chip — amber gold reads on both CT blue and T orange */
.prk {
  position: absolute; bottom: 4px; z-index: 3;
  min-width: 24px; height: 18px; padding: 0 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 800; color: #1f1400; letter-spacing: 0.5px;
  font-variant-numeric: tabular-nums;
  background: linear-gradient(135deg, #ffd75e, #ff9f2e);
  clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
  filter: drop-shadow(0 0 6px rgba(255,180,60,0.55));
}
/* side layout: badge hangs OUTSIDE the card's top edge on the screen-center side —
   CT: left edge flush with the card's right edge; T mirrored (right edge of the
   column would clip against the 18px screen margin). prow becomes overflow:visible */
body:not(.layout-bottom) .players.ct .prk { left: 100%; right: auto; top: 6px; bottom: auto; margin-left: 4px; }
body:not(.layout-bottom) .players.t .prk { right: 100%; left: auto; top: 6px; bottom: auto; margin-right: 4px; }
body:not(.layout-bottom) .players .prow { overflow: visible; }
body:not(.layout-bottom) .players .prow .pfill { border-radius: 8px; }
.prk:empty { display: none; }
/* pop animation each time the kill count goes up */
@keyframes rk-pop {
  0% { transform: scale(0.4); filter: drop-shadow(0 0 12px rgba(255,190,70,0.95)); }
  55% { transform: scale(1.28); }
  100% { transform: scale(1); filter: drop-shadow(0 0 6px rgba(255,180,60,0.55)); }
}
.prk.rk-pop { animation: rk-pop 0.35s cubic-bezier(0.2, 1.5, 0.4, 1); }
#obsplayer .prk { position: absolute; left: 6px; right: auto; top: auto; bottom: 100%; }
/* content row (T side mirrors via row-reverse) */
.pbody { position: relative; z-index: 2; display: flex; align-items: center; height: 100%; padding: 0 10px; gap: 8px; }
.players.ct .pbody { padding-left: 28px; }
.players.t .pbody { flex-direction: row-reverse; padding-right: 28px; }
/* zone 1: big hp number + armor/kit/c4 icons under it */
.php { width: 58px; flex: none; text-align: center; }
.php .hpnum { font-size: 34px; font-weight: 800; line-height: 1.05; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.6); font-variant-numeric: tabular-nums; }
.php .hpnum .ico { width: 26px; height: 26px; color: #ff6b6b; }
.php .parmor { display: flex; justify-content: center; gap: 3px; margin-top: 3px; min-height: 19px; color: rgba(255,255,255,0.85); }
.php .parmor .ico { width: 19px; height: 19px; }
/* fixed armor-row slot (armor / defuse kit / C4), always occupies its spot */
.php .parmor .aslot { width: 19px; height: 19px; flex: none; display: inline-flex; align-items: center; justify-content: center; }
/* 固定两槽排布：CT 永不渲染 C4 槽、T 永不渲染钳子槽；
   剩余 [甲][钳] / [甲][C4] 两槽固定占位，图标位置不随装备有无滑动 */
.players.ct .parmor .s-c4 { display: none; }
.players.t .parmor .s-kit { display: none; }
/* zone 2: K/D+$ row over grenades (center) */
.pmid { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-width: 0; }
.pweap { display: flex; align-items: center; justify-content: center; min-height: 26px; }
.pweap .wic { height: 26px; max-width: 96px; }
.pnades { display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 19px; }
.pnades .wic { height: 19px; }
/* side player cards: slightly tighter gap so all 4 fixed slots fit the middle zone */
.players .pnades { gap: 4px; }
/* ×2 badge for a second flashbang; wwrap doubles as the FIXED 19×19 box for every
   owned grenade, so buying/throwing a nade never changes the row's width or spacing */
.pnades .wwrap { position: relative; display: inline-flex; align-items: center; justify-content: center; width: 19px; height: 19px; flex: none; }
.pnades .wnum {
  position: absolute; top: -5px; right: -6px; z-index: 1;
  font-size: 9px; font-weight: 800; line-height: 1.2; color: #fff;
  background: rgba(0,0,0,calc(0.6 * var(--bg-a))); border-radius: 6px; padding: 0 3px;
}
/* empty grenade slot placeholder: a small dim dot — keeps every equipment position
   fixed and spacing even, without looking like an actual grenade icon */
.pnades .wslot { display: inline-flex; align-items: center; justify-content: center; width: 19px; height: 19px; flex: none; }
.pnades .wslot::after { content: ''; width: 4px; height: 4px; border-radius: 50%; background: rgba(255,255,255,0.22); }
.pweap .wic.w-on, .pnades .wic.w-on { color: #fff; }
.pweap .wic.w-off, .pnades .wic.w-off { color: rgba(255,255,255,0.45); }
.ico.lskull { fill: none; stroke: currentColor; }
/* zone 3: name + K/D + money (aligned to outer edge) */
.pinfo { width: 118px; flex: none; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.players.ct .pinfo { text-align: right; align-items: flex-end; }
.players.t .pinfo { text-align: left; align-items: flex-start; }
.pstat { display: flex; align-items: center; gap: 8px; }

/* side player cards: hp block on the outer side; top row = name + K/D;
   bottom row = weapon + grenades (both bigger); avatar in the inner bottom corner */
.players .pbody { display: block; padding: 0; }
.players .php { position: absolute; top: 50%; transform: translateY(-50%); }
.players.ct .php { left: 28px; }
.players.t .php { right: 28px; }
/* ==== side-layout rearrange ====
   armor/kit/C4: vertical stack right under the slot-number tab (the old round-kills
   spot); money takes the armor row's old place under the hp digits; the top row is
   now name + K/D only, so long ids get the money's former width too */
body:not(.layout-bottom) .players .php { top: 7px; transform: none; }
/* keep the money from jumping up when the player dies (hp digits blank out) */
body:not(.layout-bottom) .players .php .hpnum { min-height: 36px; }
body:not(.layout-bottom) .players .parmor { position: absolute; top: 21px; display: flex; flex-direction: column; gap: 3px; margin-top: 0; min-height: 0; }
body:not(.layout-bottom) .players.ct .parmor { left: 7px; }
body:not(.layout-bottom) .players.t .parmor { right: 7px; }
body:not(.layout-bottom) .players .pmoney { margin-top: 1px; }
.players .pinfo { position: absolute; top: 9px; width: auto; flex-direction: row; align-items: center; gap: 5px; z-index: 3; }
/* name zone extends over the avatar's top edge (name layer sits above it) — CJK ids
   at 14px still get ~6 glyphs before ellipsis, latin ~9; shorter ids never reach it */
.players.ct .pinfo { left: 86px; right: 72px; text-align: left; align-items: center; }
.players.t .pinfo { right: 86px; left: 72px; flex-direction: row-reverse; text-align: right; align-items: center; }
/* name stretches the row again: K/D rides the row's inner end, which now lands flush
   against the avatar's edge (CT KD right edge ↔ avatar left edge; T mirrored) */
.players .pname { flex: 1; min-width: 0; }
/* K/D sits close to the money: tight row gap, tight K-D spacing, no trailing margin */
.players .pstat { flex: none; gap: 3px; }
.players .pstat .pkd { gap: 3px; }
.players .pstat .pkd span { margin-right: 2px; }
.players .pstat .pkd span:last-child { margin-right: 0; }
.players .pstat .pkd { font-size: 14px; }
.players .pstat .pmoney { font-size: 14px; }
.players .pstat .pkd .ico { width: 14px; height: 14px; }
/* equipment row mirrored: grenades on the outer side, weapon toward screen center */
.players .pmid { position: absolute; bottom: 7px; flex: none; flex-direction: row; align-items: center; justify-content: center; gap: 6px; }
.players.ct .pmid { left: 86px; right: 74px; flex-direction: row-reverse; }
.players.t .pmid { right: 86px; left: 74px; }
.players .pmid .pweap .wic { height: 26px; max-width: 88px; }
.players .pmid .pnades .wic { height: 19px; }
.players .pmid .pnades .wslot { width: 19px; height: 19px; }
.pname { font-size: 14px; font-weight: 800; letter-spacing: 0; text-transform: uppercase; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 3px rgba(0,0,0,0.85); }
.pkd { display: flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 700; color: rgba(255,255,255,0.65); font-variant-numeric: tabular-nums; }
.pkd .ico { width: 13px; height: 13px; opacity: 0.7; }
.pkd span { color: #fff; margin-right: 5px; }
.pmoney { font-size: 14px; font-weight: 800; color: #42e35f; font-variant-numeric: tabular-nums; }
/* player avatar (from the app's Players page, matched by steamid):
   absolute overlay in the card's inner BOTTOM corner, so the name row above
   gets the zone's full width; weapon row keeps a margin so it won't slide under it */
.pavatar {
  position: absolute; bottom: 4px; z-index: 2;
  width: 64px; height: 64px; object-fit: contain;
  background: rgba(255,255,255,0.06); border-radius: 6px;
  transition: filter 0.35s ease;
}
.players.ct .pavatar { right: 6px; }
.players.t .pavatar { left: 6px; }
/* live camera iframe (VDO.Ninja) overlaid on the avatar slot — same class keeps layout */
iframe.vcam { border: 0; background: transparent; pointer-events: none; z-index: 6; }
/* team-color line-art overlay, only for the DEFAULT avatar: a CSS mask paints the
   squad color (--ct/--t) through the white-line PNG; custom player photos never
   get this layer. Copies the img's class so position/size stay in lockstep. */
.avatar-lines {
  background: var(--ct); z-index: 3; pointer-events: none;
  -webkit-mask-size: contain; mask-size: contain;
  -webkit-mask-position: center bottom; mask-position: center bottom;
  -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
}
/* camera feeds are landscape: give the OB / clutch card cam a bigger 4:3-ish frame
   than the portrait avatar box */
iframe.opavatar.vcam { width: 180px; height: 135px; }
/* states */
.prow.observed { border-color: #fff; box-shadow: 0 0 14px rgba(255,255,255,0.35); }
/* avatar fades to black & white when its player dies (a live camera iframe stays as-is) */
.prow.dead .pavatar { filter: grayscale(1); }
/* death flash: two red pulses, outer glow + inset tint so the whole card reads */
@keyframes died-flash {
  0%   { border-color: rgba(255,55,55,1);    box-shadow: 0 0 32px rgba(255,55,55,0.95), inset 0 0 30px rgba(255,45,45,0.55); }
  28%  { border-color: rgba(255,55,55,0.3);  box-shadow: 0 0 8px rgba(255,55,55,0.2),  inset 0 0 10px rgba(255,45,45,0.1); }
  55%  { border-color: rgba(255,55,55,0.95); box-shadow: 0 0 26px rgba(255,55,55,0.85), inset 0 0 24px rgba(255,45,45,0.42); }
  100% { border-color: var(--border); box-shadow: none; }
}
.prow.just-died { animation: died-flash 1.1s ease-out; }
.prow.dead .pfill { display: none; }
.prow.dead .pbody { opacity: 0.45; }
.prow.dead .pname { color: rgba(255,255,255,0.65); }
.hpbar {
  position: relative; height: 19px; margin-top: 4px;
  background: rgba(255,255,255,0.07); border-radius: 4px; overflow: hidden;
}
.hpfill { height: 100%; border-radius: 4px; transition: width 0.25s ease; }
.players.ct .hpfill { background: var(--ct); }
.players.t .hpfill { background: var(--t); }
.hpfill.low { background: #e04040 !important; }
#obsplayer .hpnum {
  position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
  font-size: 13px; font-weight: 800; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.8);
  font-variant-numeric: tabular-nums;
}
.hpbar .ico.skull-ic { position: absolute; left: 5px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; color: #ff6b6b; }
.wic { height: 16px; width: auto; fill: currentColor; }
/* obsplayer stats row still uses these */
.pstats { font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.65); font-variant-numeric: tabular-nums; letter-spacing: 0.5px; }
.pstats b { color: #fff; }

/* ============ TACTICAL TIMEOUT ============ */
#timeout {
  position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
  width: 1660px;
  background-color: rgba(4, 6, 10, calc(0.94 * var(--bg-a)));
  background-image: radial-gradient(circle, rgba(255,255,255,0.04) 1px, transparent 1.6px);
  background-size: 8px 8px;
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 8px 40px rgba(0,0,0,0.6);
  backdrop-filter: blur(8px);
  opacity: 0; visibility: hidden;
  transition: opacity 0.3s ease, visibility 0s linear 0.3s;
}
#timeout.show {
  opacity: 1; visibility: visible;
  transition: opacity 0.3s ease, visibility 0s;
}
#to-title {
  text-align: center; padding: 8px 0 6px;
  font-size: 17px; font-weight: 800; letter-spacing: 4px;
  background: rgba(0,0,0,calc(0.4 * var(--bg-a)));
  border-bottom: 1px solid var(--border);
}
#to-title.ct { color: var(--ct); }
#to-title.t { color: var(--t); }
#to-title.tech { color: #ffd94a; }
#to-body { display: flex; align-items: stretch; position: relative; }
.to-team { flex: 1; padding: 10px 12px 12px; min-width: 0; position: relative; }
.to-team.t { text-align: right; }
/* signature color arc on the outer edge, same as player cards */
.to-team::before { content: ''; position: absolute; top: 8px; bottom: 8px; width: 4px; border-radius: 4px; }
.to-team.ct::before { left: 0; background: var(--ct-deep); }
.to-team.t::before { right: 0; background: var(--t-deep); }
.to-teamhead { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.to-team.t .to-teamhead { flex-direction: row-reverse; }
.to-teamname { font-size: 18px; font-weight: 800; letter-spacing: 1px; }
.to-team.ct .to-teamname { color: var(--ct); }
.to-team.t .to-teamname { color: var(--t); }
.to-logo { width: 32px; height: 32px; border-radius: 4px; background: rgba(255,255,255,0.18); object-fit: contain; }
/* header stats: timeouts / loss bonus / equipment, inline on the same row as the team name */
/* header stats spread across the full team width (EWC-style), T side mirrored */
.to-hstats { flex: 1; display: flex; align-items: center; justify-content: space-between; gap: 10px; min-width: 0; padding: 0 10px; }
.to-team.t .to-hstats { flex-direction: row-reverse; }
.to-hstat { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; font-size: 16px; font-weight: 700; color: rgba(255,255,255,0.75); white-space: nowrap; }
.to-team.t .to-hstat { align-items: flex-end; }
.to-hstat .label { letter-spacing: 1px; text-transform: uppercase; font-size: 16px; color: rgba(255,255,255,0.45); }
.to-hstat b { color: #fff; font-variant-numeric: tabular-nums; font-size: 23px; }
.to-pips { display: inline-flex; gap: 4px; vertical-align: middle; }
.to-pip { width: 34px; height: 8px; border-radius: 4px; background: rgba(255,255,255,0.15); }
.to-team.ct .to-pip.on { background: var(--ct); }
.to-team.t .to-pip.on { background: var(--t); }
.to-prow {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 10px; border-radius: 6px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.05);
  margin-bottom: 5px;
}
.to-team.t .to-prow { flex-direction: row-reverse; }
/* true mirror symmetry: T side also reverses the inner order of equipment groups */
.to-team.t .to-picons, .to-team.t .to-pnades, .to-team.t .to-pweaps { flex-direction: row-reverse; }
.to-prow.dead { opacity: 0.35; }
.to-pname { font-size: 19px; font-weight: 800; width: 126px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-transform: uppercase; }
.to-pkd { display: flex; align-items: center; gap: 4px; font-size: 19px; font-weight: 700; color: rgba(255,255,255,0.65); font-variant-numeric: tabular-nums; width: 92px; flex: none; }
.to-pkd .ico { width: 20px; height: 20px; opacity: 0.7; }
.to-pkd span { color: #fff; margin-right: 4px; }
.to-pkd .ico.lskull { fill: none; stroke: currentColor; }
/* fixed equipment slots: every item keeps its own position regardless of what the player carries */
.to-picons { display: flex; gap: 3px; color: rgba(255,255,255,0.75); align-items: center; flex: none; }
.to-ic-slot { width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; flex: none; }
.to-ic-slot .ico { width: 24px; height: 24px; }
.to-pnades { display: flex; gap: 4px; align-items: center; flex: none; }
.to-pnade-slot { width: 22px; height: 27px; display: flex; align-items: center; justify-content: center; flex: none; color: rgba(255,255,255,0.75); }
.to-pnade-slot .wic { height: 23px; }
.to-pweaps { display: flex; gap: 6px; align-items: center; flex: 1; }
.to-team.t .to-pweaps { justify-content: flex-start; } /* row-reverse: flex-start hugs the nades side */
.to-gun-slot { display: flex; align-items: center; justify-content: center; height: 32px; flex: none; color: rgba(255,255,255,0.85); }
.to-gun-slot.primary { width: 90px; }
.to-gun-slot.pistol { width: 42px; }
.to-gun-slot .wic { height: 30px; }
.to-pmoney { font-size: 23px; font-weight: 800; color: #42e35f; font-variant-numeric: tabular-nums; width: 96px; flex: none; text-align: right; }
.to-center {
  width: 240px; flex: none;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: rgba(0,0,0,calc(0.35 * var(--bg-a)));
  border-left: 1px solid var(--border); border-right: 1px solid var(--border);
  padding: 10px;
}
.to-score { font-size: 42px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }
.to-score .ct { color: var(--ct); }
.to-score .t { color: var(--t); }
.to-vs { font-size: 11px; letter-spacing: 3px; color: rgba(255,255,255,0.4); margin-top: 4px; }

/* ============ BOMB BAR ============
   slim red strip right under the topbar: bomb explosion countdown only.
   the fill is center-anchored so both ends shrink toward the middle */
#bombbar {
  position: absolute; top: 112px; left: 50%; transform: translateX(-50%);
  width: 440px; height: 5px;
  background: rgba(255,255,255,0.08); border-radius: 3px;
  display: none; overflow: hidden;
}
#bombbar.show { display: block; }
#bombfill {
  position: absolute; left: 50%; transform: translateX(-50%);
  height: 100%; background: #ff4646; border-radius: 3px;
  box-shadow: 0 0 10px rgba(255,70,70,0.55);
  transition: width 0.1s linear;
}

/* ============ PLANT / DEFUSE ACTOR CHIP ============
   who is planting / defusing — sits below the bomb bar slot, animated show/hide */
#actor {
  position: absolute; top: 148px; left: 50%; z-index: 6;
  transform: translate(-50%, -6px);
  display: flex; align-items: center; gap: 8px;
  padding: 7px 16px; border-radius: 8px;
  background: var(--bg-panel); border: 1px solid var(--border);
  font-size: 14px; font-weight: 800; letter-spacing: 1.5px; color: #fff;
  opacity: 0; visibility: hidden; overflow: hidden;
  transition: opacity 0.25s ease, transform 0.25s ease, visibility 0s linear 0.25s;
}
#actor.show {
  opacity: 1; visibility: visible; transform: translate(-50%, 0);
  transition: opacity 0.25s ease, transform 0.25s ease, visibility 0s;
}
#actor .ico { width: 17px; height: 17px; }
#actor-name { color: #fff; text-transform: uppercase; }
#actor-verb { font-size: 12px; color: rgba(255,255,255,0.75); }
#actor.plant { border-color: color-mix(in srgb, var(--t), transparent 45%); box-shadow: 0 0 18px color-mix(in srgb, var(--t), transparent 72%); }
#actor.plant #actor-ic { color: var(--t); }
#actor.defuse { border-color: color-mix(in srgb, var(--ct), transparent 45%); box-shadow: 0 0 18px color-mix(in srgb, var(--ct), transparent 72%); }
#actor.defuse #actor-ic { color: var(--ct); }
#actor-kit { font-size: 10px; letter-spacing: 1px; padding: 1px 6px; border-radius: 4px; background: color-mix(in srgb, var(--ct), transparent 75%); color: var(--ct); }
#actor-kit:empty { display: none; }
/* mini progress bar along the chip's bottom edge: plant 3.2s / defuse 5s(kit)|10s */
#actor-track { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(255,255,255,0.08); }
#actor-fill { height: 100%; width: 0; background: var(--t); transition: width 0.1s linear; }
#actor.defuse #actor-fill { background: var(--ct); }

/* ============ ROUND RESULT BANNER ============ */
#roundbanner {
  position: absolute; top: 190px; left: 50%; transform: translateX(-50%);
  padding: 12px 48px; border-radius: 8px;
  background: var(--bg-panel); border: 1px solid var(--border);
  backdrop-filter: blur(6px);
  box-shadow: 0 8px 32px rgba(0,0,0,0.6);
  font-size: 26px; font-weight: 800; letter-spacing: 4px; text-align: center;
  display: none;
}
#roundbanner.show { display: block; }
#roundbanner.ct { color: var(--ct); border-color: var(--ct); box-shadow: 0 0 28px color-mix(in srgb, var(--ct), transparent 70%); }
#roundbanner.t { color: var(--t); border-color: var(--t); box-shadow: 0 0 28px color-mix(in srgb, var(--t), transparent 70%); }

/* ============ WAITING ============ */
#waiting {
  position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%);
  font-size: 15px; letter-spacing: 4px; font-weight: 700; color: rgba(255,255,255,0.4);
  display: flex; align-items: center; gap: 10px;
}
#waiting .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--astra-primary); animation: pulse-red 1.4s infinite; }
#waiting.hidden { display: none; }

/* ============ RADAR ============ */
#radar {
  position: absolute; left: 18px; top: 100px;
  width: 340px; height: 340px;
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 4px 24px rgba(0,0,0,0.5);
  display: none;
}
#radar.show { display: block; }
#radar-inner {
  width: 1024px; height: 1024px;
  transform: scale(0.33203125); /* 340 / 1024, JS overrides for clutch zoom */
  transform-origin: top left;
  position: relative;
  transition: transform 0.3s ease; /* smooth clutch zoom */
}
#radar-img { width: 1024px; height: 1024px; display: block; opacity: 0.9; }
.rdot {
  position: absolute; width: 90px; height: 90px;
  margin-left: -45px; margin-top: -45px; /* center on coordinate */
  transition: opacity 0.3s;
}
.rdot .rcone {
  position: absolute; inset: 0;
  transition: transform 0.12s linear;
  /* small arrow tip orbiting the dot (wrapper rotated by JS, 0deg = up) */
}
.rdot .rcone::before {
  content: ''; position: absolute; left: 50%; top: -6px;
  transform: translateX(-50%);
  border-left: 10px solid transparent;
  border-right: 10px solid transparent;
  border-bottom: 16px solid currentColor;
  filter: drop-shadow(0 0 5px currentColor);
}
.rdot .rcore {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: 56px; height: 56px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 34px; font-weight: 800; color: #06121a;
  border: 3px solid rgba(255,255,255,0.85);
}
.rdot.ct .rcore { background: var(--ct); }
.rdot.ct .rcone { color: var(--ct); }
.rdot.t .rcore { background: var(--t); }
.rdot.t .rcone { color: var(--t); }
.rdot.observed .rcore { border-color: #fff; box-shadow: 0 0 14px #fff; }
.rdot.has-c4 .rcore { border-color: #ff4646; box-shadow: 0 0 10px rgba(255,70,70,0.8); }
#rbomb {
  position: absolute; width: 64px; height: 64px;
  margin-left: -32px; margin-top: -32px;
  color: #ff4646; display: none;
  animation: pulse-red 0.8s ease-in-out infinite;
}
#rbomb.show { display: block; }

/* grenades layer: trails + effect zones, under player dots */
#rnades {
  position: absolute; left: 0; top: 0;
  width: 1024px; height: 1024px;
  pointer-events: none;
}
#rnades .rg-trail {
  fill: none; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round;
  opacity: 0.9; vector-effect: non-scaling-stroke;
}
#rnades .rg-smoke {
  fill: rgba(185,192,200,0.45); stroke: rgba(220,228,235,0.95);
  stroke-width: 4; vector-effect: non-scaling-stroke;
  filter: drop-shadow(0 0 6px rgba(200,210,220,0.5));
}
#rnades .rg-smoke.ct { stroke: var(--ct); filter: drop-shadow(0 0 7px var(--ct)); }
#rnades .rg-smoke.t  { stroke: var(--t); filter: drop-shadow(0 0 7px var(--t)); }
#rnades .rg-fire  {
  fill: url(#rgFireGrad);
  filter: drop-shadow(0 0 10px rgba(255,120,40,0.85));
}
#rnades .rg-ring { fill: none; stroke-width: 4; vector-effect: non-scaling-stroke; }
#rnades .rg-ic { fill: currentColor; }

/* ============ RADAR-ONLY VIEW (#radar): full-window radar for observers ============ */
body.radar-only { background: #0d0f16; }
body.radar-only .players,
body.radar-only #obsplayer,
body.radar-only #topbar,
body.radar-only #mapstrip,
body.radar-only #roundbanner,
body.radar-only #roundhist,
body.radar-only #bombbar,
body.radar-only #actor,
body.radar-only #timeout,
body.radar-only .fz-team,
body.radar-only #edit-toolbar,
body.radar-only #edit-pill { display: none !important; }
body.radar-only #radar {
  transform-origin: top left; /* position + scale set by JS to fit window */
}

/* ============ FREEZETIME ECONOMY (utility + team money) ============ */
.fz-team {
  position: absolute; bottom: 425px; width: 305px;
  padding: 6px 14px 8px;
  background: var(--bg-panel); border: 1px solid var(--border); border-radius: 8px;
  backdrop-filter: blur(4px);
  opacity: 0; visibility: hidden; transform: translateY(10px);
  transition: opacity 0.25s ease, transform 0.25s ease, visibility 0s linear 0.25s;
}
.fz-team.show {
  opacity: 1; visibility: visible; transform: none;
  transition: opacity 0.25s ease, transform 0.25s ease, visibility 0s;
}
#fz-ct { left: 18px; border-top: 3px solid var(--ct); }
#fz-t { right: 18px; border-top: 3px solid var(--t); }
.fz-nades { display: flex; justify-content: center; gap: 14px; padding: 2px 0 6px; border-bottom: 1px solid var(--border); }
.fz-item { display: flex; align-items: center; gap: 5px; font-size: 16px; font-weight: 800; }
.fz-item .wic { height: 24px; }
#fz-ct .fz-item { color: var(--ct); }
#fz-t .fz-item { color: var(--t); }
.fz-item span { color: #fff; }
.fz-eco { display: flex; justify-content: space-between; padding-top: 6px; }
.fz-eco .fz-cell { display: flex; flex-direction: column; gap: 1px; }
.fz-eco .label { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 700; }
#fz-ct .fz-eco .label { color: var(--ct); }
#fz-t .fz-eco .label { color: var(--t); }
.fz-eco .val { font-size: 19px; font-weight: 800; color: #fff; font-variant-numeric: tabular-nums; }
.fz-pips { display: inline-flex; gap: 3px; margin-left: 6px; vertical-align: middle; }
.fz-pip { width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,0.15); }
#fz-ct .fz-pip.on { background: var(--ct); }
#fz-t .fz-pip.on { background: var(--t); }

/* ============ LAYOUT VARIANT: BOTTOM ROW (?layout=bottom, used by the astra-bottom loader) ============
   Square cards in one horizontal row at bottom-left / bottom-right, instead of the
   default 72px-tall side columns. Every rule is scoped under body.layout-bottom +
   .players, so the default side layout and #obsplayer (which reuses .pmid/.pkd/.prk
   markup) are completely untouched. */
body.layout-bottom .players { flex-direction: row; width: auto; bottom: 14px; gap: 6px; }
body.layout-bottom #players-left { left: 14px; }
body.layout-bottom #players-right { right: 14px; }
body.layout-bottom .players .prow { width: 132px; height: 142px; flex: none; overflow: visible; }
/* team color arc: vertical side bar → horizontal bar along the bottom edge */
body.layout-bottom .players .prow::before,
body.layout-bottom .players.ct .prow::before,
body.layout-bottom .players.t .prow::before {
  top: auto; bottom: 0; left: 6px; right: 6px; width: auto; height: 4px;
}
/* card interior: absolute zones, identical on both sides (no T-side row-reverse mirror) */
body.layout-bottom .players .pbody,
body.layout-bottom .players.ct .pbody,
body.layout-bottom .players.t .pbody { padding: 0; flex-direction: row; }
/* avatar: top-left block. Position via left/top only — the inline transform stays
   reserved for the per-player scale/offset set from the app's Players page */
body.layout-bottom .players .pavatar,
body.layout-bottom .players.ct .pavatar,
body.layout-bottom .players.t .pavatar { position: absolute; left: 6px; right: auto; top: 16px; width: 72px; height: 72px; margin: 0; z-index: 1; }
/* hp number + armor/kit/c4 icons: top-right, right-aligned */
body.layout-bottom .players .php { position: absolute; top: 26px; right: 5px; left: auto; width: auto; text-align: right; }
body.layout-bottom .players .php .hpnum { font-size: 30px; }
body.layout-bottom .players .php .hpnum .ico { width: 20px; height: 20px; }
/* armor row: reversed so the armor icon sits right under the hp digits, kit/c4 extend leftward */
body.layout-bottom .players .php .parmor { flex-direction: row-reverse; justify-content: flex-end; gap: 2px; margin-top: 0; min-height: 16px; }
body.layout-bottom .players .php .parmor .ico { width: 16px; height: 16px; }
body.layout-bottom .players .php .parmor .aslot { width: 16px; height: 16px; }
/* hp fill: vertical bar, full width, anchored to the bottom edge so it drains top→bottom.
   border-radius keeps the card's round corners (prow overflow is visible for the kill badge) */
body.layout-bottom .players .pfill,
body.layout-bottom .players.ct .pfill,
body.layout-bottom .players.t .pfill {
  top: auto; bottom: 0; left: 0; right: 0; width: 100%;
  border-radius: 8px;
  transition: height 0.25s ease;
}
/* name + K/D: single row above the color bar (money moved up under the armor icons,
   so the name gets the full strip width and no longer truncates) */
/* containers become positioning canvases; each child is placed absolutely */
body.layout-bottom .players .pinfo,
body.layout-bottom .players .pmid { position: absolute; inset: 0; width: auto; padding: 0; display: block; }
/* name: top-right, under the armor icons (swapped with money); sits above the avatar
   layer so a long id may overlap the avatar's lower edge */
body.layout-bottom .players .pname {
  position: absolute; top: 73px; right: 8px; z-index: 2;
  font-size: 13px; max-width: 122px; text-align: right;
}
/* weapon: left half of the equipment row; grenades: right half — both fixed */
body.layout-bottom .players .pweap { position: absolute; left: 6px; bottom: 30px; margin: 0; min-height: 21px; width: 52px; justify-content: center; }
body.layout-bottom .players .pweap .wic { height: 21px; max-width: 50px; }
body.layout-bottom .players .pnades { position: absolute; right: 6px; bottom: 30px; min-height: 15px; gap: 3px; }
body.layout-bottom .players .pnades .wic { height: 15px; }
body.layout-bottom .players .pnades .wslot { width: 15px; height: 15px; }
body.layout-bottom .players .pnades .wwrap { width: 15px; height: 15px; }
/* K/D (left) + money (right): the bottom strip above the color bar */
body.layout-bottom .players .pstat {
  position: absolute; left: 6px; right: 8px; bottom: 7px;
  flex-direction: row; align-items: center; justify-content: space-between; gap: 6px; min-height: 0;
}
body.layout-bottom .players .pkd { font-size: 14px; }
body.layout-bottom .players .pkd .ico { width: 14px; height: 14px; }
body.layout-bottom .players .pmoney { font-size: 13px; }
/* slot number tab: always the top-LEFT corner in the square-card layout
   (hp lives at top-right, so the default T-side right tab would cover it) */
body.layout-bottom .players .pslot,
body.layout-bottom .players.ct .pslot,
body.layout-bottom .players.t .pslot {
  left: 0; right: auto; padding-left: 9px; padding-right: 10px;
  clip-path: none; /* slanted tab had a sharp top-left corner that clashed with the card's round corner */
  border-radius: 8px 0 6px 0;
}
body.layout-bottom .players.ct .pslot { background: var(--ct); }
body.layout-bottom .players.t .pslot { background: var(--t); }
/* round-kills badge: top-RIGHT corner, its bottom edge sitting on the card's top edge */
body.layout-bottom .players.ct .prk,
body.layout-bottom .players.t .prk { right: 6px; left: auto; top: auto; bottom: 100%; }
/* freezetime economy: hoist above the card row (cards occupy bottom 14px + 142px), sides unchanged */
body.layout-bottom .fz-team { bottom: 176px; }
/* raise the observed-player card above the taller tile rows (tiles top out at 156px) */
body.layout-bottom #obsplayer { bottom: 96px; }

/* ============ ROUND HISTORY (freezetime, top center) ============ */

/* hide player columns & observed panel during tactical timeout (not in layout editor) */
body.phase-timeout:not(.editing) .players, body.phase-timeout:not(.editing) #obsplayer, body.phase-timeout:not(.editing) .clutch { display: none !important; }

/* ============ OBSERVED PLAYER (spectating) ============ */
#obsplayer {
  position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%);

}

/* card background layer: keeps the rounded-rect clip for the hp fill,
   while the avatar (in .opbody) is free to rise above the top edge */
.opcard {
  position: absolute; inset: 0; overflow: hidden;
  background: rgba(4, 6, 10, calc(0.9 * var(--bg-a)));

}
/* signature bright color arc on the left edge */
#obsplayer::before {
  content: ''; position: absolute; left: 0; top: 6px; bottom: 6px; width: 4px; border-radius: 4px; z-index: 3;
}
#obsplayer.ct::before { background: var(--ct); box-shadow: 0 0 8px var(--ct); }

.clutch::before { content: ''; position: absolute; left: 0; top: 6px; bottom: 6px; width: 4px; border-radius: 4px; z-index: 3; }

.clutch.t::before { background: var(--t); box-shadow: 0 0 8px var(--t); }

/* clutch kill badge: above the card's top-right corner, bottom flush with the card's top edge */
.clutch .prk { position: absolute; left: auto; right: 6px; top: auto; bottom: 100%; }
/* clutch equipment row: grenades shift left, armor/kit/C4 takes the freed right side */
.clutch .pequip { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 19px; }
.clutch .parmor { display: flex; gap: 3px; min-height: 19px; color: rgba(255,255,255,0.85); }
.clutch .parmor .ico { width: 19px; height: 19px; }
.clutch .parmor .aslot { width: 19px; height: 19px; flex: none; display: inline-flex; align-items: center; justify-content: center; }
.opbody { position: relative; z-index: 2; display: flex; align-items: center; height: 100%; padding: 0 12px 0 14px; gap: 10px; }
.op-slot { font-size: 12px; font-weight: 800; color: #06121a; background: #fff; border-radius: 3px; padding: 1px 6px; flex: none; min-width: 18px; text-align: center; }

.op-hp .ico { width: 26px; height: 26px; color: #ff6b6b; }

.op-namerow { display: flex; align-items: center; gap: 8px; min-width: 0; }
.op-namerow .op-name { min-width: 0; }
/* big portrait avatar: bottom-anchored to the card, rises ~24px above the top edge.
   transparent background so cutout PNG portraits blend in */
/* big portrait avatar: horizontally centered, standing entirely ABOVE the card
   (bottom edge flush with the card's top edge), like tournament HUDs.

.opavatar {
  position: absolute; left: 50%; bottom: 100%; transform: translateX(-50%);

<script>
'use strict';
/* ================= Astra Default HUD =================
 * Data: Project Replay replay-hud events (live CS2 GSI)
 * Match/teams: LHM-compatible API on http://127.0.0.1:6657
 * Colors: --astra-* CSS vars injected by Astra Director overlay window
 * ===================================================== */

const $ = id => document.getElementById(id);

/* ---------- SVG icon sprite (paths have no fill -> follow CSS color) ---------- */
const SPRITE = {
  timer: 'icon_timer_default.svg', bomb: 'icon_bomb_default.svg', c4: 'icon_c4_default.svg',
  defuse: 'icon_defuse_default.svg', armor: 'icon_armor_half_default.svg',
  helmet: 'icon_armor_helmet_default.svg', health: 'icon_health_default.svg',
  skull: 'icon_skull_default.svg', kills: 'icon_kills.svg', bullets: 'icon_bullets_default.svg'
};
const WEAPON_FILES = ['ak47','aug','awp','bayonet','bizon','c4','cz75a','deagle','decoy','elite','famas','fiveseven','flashbang','g3sg1','galilar','glock','hegrenade','hkp2000','incgrenade','inferno','knife','knife_bayonet','knife_butterfly','knife_canis','knife_cord','knife_css','knife_falchion','knife_flip','knife_gut','knife_gypsy_jackknife','knife_karambit','knife_m9_bayonet','knife_outdoor','knife_push','knife_skeleton','knife_stiletto','knife_survival_bowie','knife_t','knife_tactical','knife_ursus','knife_widowmaker','m249','m4a1','m4a1_silencer','mac10','mag7','molotov','mp5sd','mp7','mp9','negev','nova','p250','p90','revolver','sawedoff','scar20','sg556','smokegrenade','ssg08','taser','tec9','ump45','usp_silencer','xm1014'];
const WB = {}; // weapon id -> {w, h} viewBox size
async function svgToSymbol(id, url, fallbackVb) {
  try {
    const t = await fetch(url).then(r => r.text());
    const tag = t.match(/<svg[^>]*>/);
    const body = t.match(/<svg[^>]*>([\s\S]*?)<\/svg>/);
    if (!body) return null;
    const vbMatch = tag && tag[0].match(/viewBox="([^"]+)"/);
    const vb = vbMatch ? vbMatch[1] : fallbackVb;
    return { html: '<symbol id="' + id + '" viewBox="' + vb + '">' + body[1].replace(/ fill="[^"]*"/g, '') + '</symbol>', vb };
  } catch (e) { return null; }
}
async function loadSprite() {
  const parts = [];
  for (const [id, f] of Object.entries(SPRITE)) {
    const s = await svgToSymbol('i-' + id, 'assets/' + f, '0 0 256 256');
    if (s) parts.push(s.html);
  }
  for (const w of WEAPON_FILES) {
    const s = await svgToSymbol('w-' + w, 'assets/weapons/' + w + '.svg', '0 0 100 40');
    if (s) {
      parts.push(s.html);
      const p = s.vb.split(/\s+/).map(Number);
      WB[w] = { w: p[2] || 100, h: p[3] || 40 };
    }
  }
  const div = document.createElement('div');
  div.style.display = 'none';
  div.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg">' + parts.join('') + '</svg>';
  document.body.appendChild(div);
  spriteReady = true;
  if (lastGsi) render(lastGsi); // re-render once weapon viewBoxes are known
}
function icon(id, cls) {
  return '<svg class="ico ' + (cls || '') + '" viewBox="0 0 256 256"><use href="#i-' + id + '"/></svg>';
}
function weaponIcon(rawName, cls) {
  let id = (rawName || '').replace(/^weapon_/, '');
  if (!WB[id]) {
    if (id === 'm4a1_silencer_off') id = 'm4a1_silencer';
    else if (id === 'usp_silencer_off') id = 'usp_silencer';
  }
  // unknown knife variants (kukri etc.) -> generic knife icon
  if (!WB[id] && (id.indexOf('knife') === 0 || id.indexOf('bayonet') === 0)) id = 'knife';
  if (!WB[id]) return icon('bullets', cls);
  return '<svg class="wic ' + (cls || '') + '" viewBox="0 0 ' + WB[id].w + ' ' + WB[id].h + '"><use href="#w-' + id + '"/></svg>';
}

/* ---------- Weapon pretty names: icons come from SVG sprite (w-*) ---------- */

/* ---------- State ---------- */
let teamsInfo = { left: { name: '', logo: '' }, right: { name: '', logo: '' } };
let matchInfo = null; // { matchType, left:{wins}, right:{wins}, vetos:[] }
let lastGsi = null;
let phaseEndsAt = 0;
let curPhase = '';
let bombState = null;
let lastMapRound = null;
// Technical pause: GSI reports phase 'paused' during mp_pause_match (same approach as
// JTs-Hud/OpenHud). Older/edge builds may instead freeze in 'freezetime' with
// phase_ends_in not ticking — kept as a fallback heuristic.
let techPaused = false;
let lastFreezeEndsIn = null;
let freezeStuckSince = 0;
let hudScale = 1; // current #hud scale factor (used by layout editor math)

/* ---------- Fit to window (design 1920x1080) ---------- */
function fit() {
  const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
  hudScale = s;
  $('hud').style.transform = 'scale(' + s + ')';
}
window.addEventListener('resize', fit);
fit();

/* ---------- Match/team API polling (same-origin on the HUD server) ---------- */
async function pollMatchData() {
  try {
    const [m, l, r] = await Promise.all([
      fetch('/api/match/current').then(x => x.json()),

/* ---------- Side detection: which app-team is CT? ---------- */
function detectSides(gsi) {
  // Authoritative side info from the app: the main process attaches leftIsCt to the
  // match payload (/api/match/current -> matchInfo). true = app-left team plays CT,
  // false = app-left team plays T (sides swapped), null/absent = unknown.
  // Prefer it over name matching, which breaks when the recorded team names differ
  // from the in-game names.
  if (matchInfo && typeof matchInfo.leftIsCt === 'boolean') {
    return { swapped: !matchInfo.leftIsCt };
  }
  // fallback: match GSI team names against the app-recorded names
  // default: left team = CT, right team = T
  const ctName = (gsi.map && gsi.map.team_ct && gsi.map.team_ct.name || '').toLowerCase().trim();
  const tName = (gsi.map && gsi.map.team_t && gsi.map.team_t.name || '').toLowerCase().trim();
  const lName = (teamsInfo.left.name || '').toLowerCase().trim();
  const rName = (teamsInfo.right.name || '').toLowerCase().trim();
  if (ctName && rName && ctName === rName && ctName !== lName) {
    return { swapped: true }; // right team plays CT
  }
  if (tName && lName && tName === lName && tName !== rName) {
    return { swapped: true };
  }
  return { swapped: false };
}

  if (!planted) { explodeAt = 0; bar.classList.remove('show'); return; }

function pickShownWeapon(weapons) {
  const isCarryGun = w => w.type !== 'Knife' && w.type !== 'Grenade' && w.type !== 'C4' && w.name !== 'weapon_c4' && w.type !== 'Pistol';
  return weapons.find(isCarryGun) || weapons.find(w => w.type === 'Pistol') || weapons.find(w => w.type === 'Knife') || null;
}
function weaponStateCls(w) { return w && w.state === 'active' ? 'w-on' : 'w-off'; }

/* fixed armor-row slots: armor/helmet → defuse kit → C4; missing ones keep an
   invisible fixed-size slot so icons never shift position */
function fixedArmorHtml(st, hasC4) {
  return '<span class="aslot s-armor">' + (st.armor > 0 ? icon(st.helmet ? 'helmet' : 'armor') : '') + '</span>' +
    '<span class="aslot s-kit">' + (st.defusekit ? icon('defuse') : '') + '</span>' +
    '<span class="aslot s-c4">' + (hasC4 ? icon('c4') : '') + '</span>';
}

/* fixed grenade slots: flash → smoke → HE → fire. CS2 caps at 4 grenades, so 4 slots
   always suffice; a second flash shows as a ×2 badge on the flash slot. Missing ones
   render a small dot placeholder; decoys etc. append after. */
function fixedNadesHtml(nades) {
  const pool = nades.slice();
  const take = pred => { const i = pool.findIndex(pred); return i >= 0 ? pool.splice(i, 1)[0] : null; };
  const isFlash = n => n.name === 'weapon_flashbang';
  const f1 = take(isFlash), f2 = take(isFlash);
  const shownFlash = [f1, f2].find(f => f && f.state === 'active') || f1;
  const flashHtml = shownFlash
    ? '<span class="wwrap">' + weaponIcon(shownFlash.name, weaponStateCls(shownFlash)) +
      (f2 ? '<span class="wnum">2</span>' : '') + '</span>'
    : '<span class="wslot"></span>';
  const slots = [
    flashHtml,
    ...[n => n.name === 'weapon_smokegrenade',
        n => n.name === 'weapon_hegrenade',
        n => /weapon_(molotov|incgrenade|incendiary)/.test(n.name)]
      .map(d => { const n = take(d); return n ? '<span class="wwrap">' + weaponIcon(n.name, weaponStateCls(n)) + '</span>' : '<span class="wslot"></span>'; }),
  ];
  for (const n of pool) slots.push('<span class="wwrap">' + weaponIcon(n.name, weaponStateCls(n)) + '</span>'); // decoys etc. append after
  return slots.join('');
}

function updatePlayerPanel(container, cache, players, observedSid) {
  const seen = new Set();
  for (const p of players) {
    seen.add(p.sid);
    let refs = cache.get(p.sid);
    if (!refs) { refs = buildProw(); cache.set(p.sid, refs); }
    const st = p.state || {};
    const stats = p.match_stats || {};
    const hp = Math.max(0, st.health || 0);
    const dead = hp <= 0;
    const weapons = Object.values(p.weapons || {});
    const shown = pickShownWeapon(weapons);
    const nades = weapons.filter(w => w.type === 'Grenade');
    const hasC4 = weapons.some(w => w.name === 'weapon_c4');

    refs.root.classList.toggle('dead', dead);
    refs.root.classList.toggle('observed', p.sid === observedSid);
    refs.root.classList.toggle('low', hp <= 25 && hp > 0);
    // death flash: red glow the moment hp drops to 0 (cleared on respawn)
    const prevHp = refs.last.hpval;
    if (prevHp != null && prevHp > 0 && dead) {
      refs.root.classList.remove('just-died');
      void refs.root.offsetWidth; // restart the animation on rapid re-death
      refs.root.classList.add('just-died');
    } else if (!dead && prevHp === 0) {
      refs.root.classList.remove('just-died');
    }
    refs.last.hpval = hp;
    setTxt(refs.slot, p.observer_slot != null ? String((p.observer_slot + 1) % 10) : '', refs, 'slot');
    setRk(refs.rk, st, refs);
    setTxt(refs.name, p.name || '?', refs, 'name');
    // avatar: only touch img.src when the resolved source actually changed (10Hz updates)
    const avSrc = avatarSrcFor(p.sid, p.team);
    if (refs.last.avatar !== avSrc) { refs.last.avatar = avSrc; refs.avatar.src = avSrc; }
    const avTf = avatarTfFor(p.sid);
    if (refs.last.avtf !== avTf) { refs.last.avtf = avTf; refs.avatar.style.transform = avTf; }
    syncAvatarLines(refs.avatar, p.team, isDefaultAvatar(p.sid));
    syncVcam(refs.avatar, p.sid);
    setHtml(refs.hpnum, dead ? '' : String(hp), refs, 'hpn');

    const hpW = hp + '%';
    if (refs.last.hpw !== hpW) {
      refs.last.hpw = hpW;
      // bottom layout: vertical bar draining top→bottom; side layout: horizontal width
      if (document.body.classList.contains('layout-bottom')) refs.fill.style.height = hpW;
      else refs.fill.style.width = hpW;
    }

    let ic = fixedArmorHtml(st, hasC4);
    setHtml(refs.armor, dead ? '' : ic, refs, 'icons');
    setHtml(refs.kd, icon('kills') + '<span>' + (stats.kills || 0) + '</span>' + SKULL_SVG + '<span>' + (stats.deaths || 0) + '</span>', refs, 'kd');
    setTxt(refs.money, '$' + (st.money || 0).toLocaleString(), refs, 'money');

    const nadeSig = nades.map(n => n.name + ':' + (n.state === 'active' ? 1 : 0)).join(',') + '|' + dead + '|' + spriteReady;
    if (refs.last.nadeSig !== nadeSig) {
      refs.last.nadeSig = nadeSig;
      refs.nades.innerHTML = dead ? '' : fixedNadesHtml(nades);
    }
    const weapSig = (shown ? shown.name + '|' + shown.state : 'none') + '|' + dead + '|' + spriteReady;
    if (refs.last.weapSig !== weapSig) {
      refs.last.weapSig = weapSig;
      refs.weap.innerHTML = (dead || !shown) ? '' : weaponIcon(shown.name, weaponStateCls(shown));
    }
  }
  for (const [sid, refs] of cache) {
    if (!seen.has(sid)) { refs.root.remove(); cache.delete(sid); }
  }
  const orderSig = players.map(p => p.sid).join(',');
  if (container.dataset.order !== orderSig) {
    container.dataset.order = orderSig;
    for (const p of players) { const r = cache.get(p.sid); if (r) container.appendChild(r.root); }
  }
}

/* ---------- Radar (calibration from LexoRadar, 1024px space) ---------- */
const RADAR_CFG = {
  de_ancient:  { x: 583.259, y: 428.922, sx: 0.198351, sy: -0.201082 },
  de_anubis:   { x: 536.339, y: 638.079, sx: 0.190791, sy: -0.189939 },
  de_cache:    { x: 361.724, y: 579.554, sx: 0.183093, sy: -0.176507 },
  de_dust2:    { x: 563.134, y: 736.954, sx: 0.227832, sy: -0.227765 },
  de_inferno:  { x: 426.514, y: 790.727, sx: 0.204169, sy: -0.204657 },
  de_mirage:   { x: 645.720, y: 340.292, sx: 0.201185, sy: -0.201383 },
  de_nuke:     { x: 473.128, y: 165.733, sx: 0.143761, sy: -0.147367, lower: { dx: 9, dy: 483, zCut: -495 } },
  de_overpass: { x: 927.399, y: 343.822, sx: 0.192372, sy: -0.194275 },
  de_train:    { x: 527.366, y: 511.815, sx: 0.215326, sy: -0.212993 },
  de_vertigo:  { x: 971.554, y: 424.562, sx: 0.347082, sy: -0.345088, lower: { dx: 0, dy: 575, zCut: 11700 } }

function parseVec(s) {
  if (Array.isArray(s)) return s.map(Number);
  if (typeof s === 'string') return s.split(',').map(Number);
  return null;
}
// multi-level maps (nuke/vertigo): the radar image stacks the lower level below the upper;
// anything below zCut (per official overview verticalsections) is plotted onto the lower sub-image.
function radarXY(cfg, pos) {
  let px = cfg.x + pos[0] * cfg.sx, py = cfg.y + pos[1] * cfg.sy;
  const L = cfg.lower;
  if (L && pos.length > 2 && pos[2] < L.zCut) { px += L.dx; py += L.dy; }
  return [px, py];
}
const RADAR_SIZE = 340;
const RBASE = RADAR_SIZE / 1024;
const RADAR_Z0 = 1.15; // default crop: slight margin trim, keeps the full playable area
const DOT_SCALE = 1.3; // radar dots drawn 30% larger than zoom-compensated size

/* custom map packs from the app (data/custom-maps): radar config + image served by the
   HUD server, merged over the built-in RADAR_CFG. Retried (debounced) when GSI reports
   a map we don't know yet, so packs added after page load get picked up. */
const RADAR_CUSTOM = {}; // mapName -> true → image at /custom-radars/<map>.png
let customRadarRetryAt = 0;
async function loadCustomRadars() { /* Replay uses bundled radar assets. */ }
loadCustomRadars();

/* stable radar dots: one element per steamid, updated in place */
const rdotCache = new Map();
/* per-player multi-level state: locked level + fade bookkeeping (nuke/vertigo) */
const rdotLevel = new Map();
function buildRdot() {
  const root = document.createElement('div');
  root.className = 'rdot';
  root.innerHTML = '<div class="rcone"></div><div class="rcore"></div>';
  const q = s => root.querySelector(s);
  return { root, cone: q('.rcone'), core: q('.rcore'), last: {} };
}
let radarMapName = '';

/* analyze the radar image's content bbox (alpha) so the map is centered and zoom-fitted */
const radarBoxCache = {}; // mapName -> {cx, cy, w, h} in 1024 space
function analyzeRadarBox(img, mapName) {
  try {
    const S = 256;
    const c = document.createElement('canvas');
    c.width = c.height = S;
    const ctx = c.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(img, 0, 0, S, S);
    const d = ctx.getImageData(0, 0, S, S).data;
    let minX = S, maxX = -1, minY = S, maxY = -1;
    for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
      if (d[(y * S + x) * 4 + 3] > 24) {
        if (x < minX) minX = x; if (x > maxX) maxX = x;
        if (y < minY) minY = y; if (y > maxY) maxY = y;
      }
    }
    if (maxX < 0) return;
    const k = 1024 / S;
    radarBoxCache[mapName] = { cx: (minX + maxX) / 2 * k, cy: (minY + maxY) / 2 * k, w: (maxX - minX + 1) * k, h: (maxY - minY + 1) * k };
    if (lastGsi && radarMapName === mapName) renderRadar(lastGsi);
  } catch (e) { /* keep fallback view */ }
}

function renderRadar(gsi) {
  const radar = $('radar');
  const mapName = (gsi.map && gsi.map.name) || '';
  const cfg = RADAR_CFG[mapName];
  if (!cfg) {
    radar.classList.remove('show');
    // unknown map: maybe a custom pack was added after page load — refetch (5s debounce)
    const nowTs = Date.now();
    if (mapName && nowTs - customRadarRetryAt > 5000) { customRadarRetryAt = nowTs; loadCustomRadars(); }
    return;
  }
  radar.classList.add('show');
  if (radarMapName !== mapName) { radarMapName = mapName; nadeTrails.clear(); nadeBursts.clear(); nadeFires.clear(); nadeDone.clear(); nadeTeams.clear(); rdotLevel.clear(); }
  const img = $('radar-img');
  const src = RADAR_CUSTOM[mapName] ? '/custom-radars/' + mapName + '.png' : 'assets/radars/' + mapName + '.png';
  if (!img.src.endsWith(src)) {
    // 404 (e.g. missing custom map image): hide just the map image — the dot/nade
    // layers keep rendering; onload restores visibility when a map loads again
    img.onload = () => { img.style.display = ''; analyzeRadarBox(img, mapName); };
    img.onerror = () => { img.style.display = 'none'; };
    img.src = src;
  }

  const observed = gsi.player && gsi.player.steamid;
  const all = gsi.allplayers || {};
  const pts = [];
  for (const [sid, p] of Object.entries(all)) {
    if (!p || typeof p !== 'object') continue;
    const pos = parseVec(p.position);
    if (!pos) continue;
    const dead = !(p.state && p.state.health > 0);
    if (dead) continue; // dead players: no dot at all (GSI makes their position follow spectate target)
    const [px, py] = radarXY(cfg, pos);
    pts.push({
      sid,
      px, py,
      ux: cfg.x + pos[0] * cfg.sx, // raw upper-level projection (for cross-fade)
      uy: cfg.y + pos[1] * cfg.sy,
      z: pos.length > 2 ? pos[2] : null,
      deg: Math.atan2((parseVec(p.forward) || [0, 1, 0])[0], (parseVec(p.forward) || [0, 1, 0])[1]) * 180 / Math.PI,
      hasC4: Object.values(p.weapons || {}).some(w => w.name === 'weapon_c4'),
      side: p.team === 'CT' ? 'ct' : 't',
      slot: p.observer_slot != null ? (p.observer_slot + 1) % 10 : ''

  // Default view: center + zoom-fit the map image's content bbox (fallback: image center)
  const box = radarBoxCache[mapName];
  let z = RADAR_Z0, cx = 512, cy = 512;

  }
  let tx = RADAR_SIZE / 2 - cx * RBASE * z, ty = RADAR_SIZE / 2 - cy * RBASE * z;
  { // keep the image covering the whole panel
    const minT = RADAR_SIZE - 1024 * RBASE * z;

  const b = gsi.bomb;

const rhRefs = { last: '' };

  const isOT = curRound > 24;
  // regulation: 12-cell half view; overtime (MR3): 6-cell view of the current OT period
  const halfBase = isOT ? 24 + Math.floor((curRound - 25) / 6) * 6 : (curRound > 12 ? 12 : 0);
  const cellCount = isOT ? 6 : 12;
  const sig = JSON.stringify(wins) + '|' + curRound + '|' + spriteReady;

  let html = '<div class="rh-title">ROUND HISTORY</div>';

      let cls = 'rh-mark';

/* ---------- Main render ---------- */
/* Merge partial GSI packets with last good data, so missing fields
   (weapons/state/money in some packets) don't flash zeros */
let mergedPlayers = {};
let mergedMap = {};
function mergeGsi(gsi) {
  const out = { ...gsi };
  const all = gsi.allplayers;
  if (all && Object.keys(all).length) {
    const cur = {};
    for (const [sid, p] of Object.entries(all)) {
      if (!p || typeof p !== 'object') continue; // null entry would kill the whole frame render
      const prev = mergedPlayers[sid] || {};
      // state/match_stats are complete snapshots WHEN PRESENT — never deep-merge
      // them: GSI omits defusekit (and other absence-typed keys) when false, so
      // merging would glue a once-owned kit to the player forever (even after
      // halftime side-switch). Only fall back to prev when the whole sub-object
      // is missing from this packet (the anti-flicker case).
      const hasState = p.state && Object.keys(p.state).length;
      const hasStats = p.match_stats && Object.keys(p.match_stats).length;
      cur[sid] = {
        ...prev, ...p,
        state: hasState ? { ...p.state } : (prev.state || {}),
        match_stats: hasStats ? { ...p.match_stats } : (prev.match_stats || {}),
        weapons: (p.weapons && Object.keys(p.weapons).length) ? p.weapons : (prev.weapons || {})
      };
    }
    mergedPlayers = cur;
    out.allplayers = mergedPlayers;
  } else if (Object.keys(mergedPlayers).length) {
    out.allplayers = mergedPlayers;
  }
  const m = gsi.map || {};
  // New map or match restart: drop carried-over state so the previous map's
  // round_wins / scores / player stats don't linger while fresh packets arrive.
  const mapSwitched = m.name && mergedMap.name && m.name !== mergedMap.name;
  const roundReset = typeof m.round === 'number' && typeof mergedMap.round === 'number' && m.round < mergedMap.round;
  if (mapSwitched || roundReset) {
    mergedMap = {};
    mergedPlayers = {};
  }
  mergedMap = {
    ...mergedMap, ...m,
    team_ct: { ...(mergedMap.team_ct || {}), ...(m.team_ct || {}) },
    team_t: { ...(mergedMap.team_t || {}), ...(m.team_t || {}) }
  };
  out.map = mergedMap;
  return out;
}

function render(gsi) {
  gsi = mergeGsi(gsi);
  lastGsi = gsi;
  $('waiting').classList.add('hidden');

  const pc = gsi.phase_countdowns || {};
  if (pc.phase) {
    curPhase = pc.phase;
    // jitter guard: only re-base the clock when the packet disagrees by >0.3s,
    // and never let a malformed value turn phaseEndsAt into NaN
    const t = parseFloat(pc.phase_ends_in || 0);
    if (isFinite(t)) {
      const newEnd = Date.now() + t * 1000;
      if (Math.abs(newEnd - phaseEndsAt) > 300) phaseEndsAt = newEnd;
    }
  }
  // Technical pause detection:
  //  1) native GSI phase 'paused' (mp_pause_match / referee pause) — instant
  //  2) fallback: freezetime whose countdown doesn't tick down for >2.5s
  if (pc.phase === 'paused') {
    techPaused = true;
    lastFreezeEndsIn = null;
    freezeStuckSince = 0;
  } else if (pc.phase === 'freezetime') {
    const v = parseFloat(pc.phase_ends_in || 0);
    if (lastFreezeEndsIn !== null && Math.abs(v - lastFreezeEndsIn) < 0.05) {
      if (!freezeStuckSince) freezeStuckSince = Date.now();
    } else {
      freezeStuckSince = 0;
    }
    lastFreezeEndsIn = v;
    techPaused = freezeStuckSince > 0 && (Date.now() - freezeStuckSince) > 2500;
  } else if (pc.phase) {
    lastFreezeEndsIn = null;
    freezeStuckSince = 0;
    techPaused = false;
  }
  // New round started: clear any stale bomb state (covers mid-live page reloads
  // where the old 'planted' packet would otherwise keep drawing the C4 strip)
  const roundNow = (gsi.map && typeof gsi.map.round === 'number') ? gsi.map.round : null;
  if (roundNow !== null && lastMapRound !== null && roundNow !== lastMapRound) bombState = null;
  if (roundNow !== null) lastMapRound = roundNow;
  if (gsi.bomb) bombState = gsi.bomb; // keep last bomb packet if this one omits it
  if (curPhase === 'freezetime' || curPhase === 'over') bombState = null;
  document.body.classList.toggle('phase-timeout', curPhase === 'timeout_ct' || curPhase === 'timeout_t' || techPaused);

  renderTeams(gsi);
  renderMapStrip(gsi);
  renderPlayers(gsi);
  renderObserved(gsi);
  renderBanner(gsi);
  renderRadar(gsi);
  renderTimeout(gsi);
  renderFreezetime(gsi);
  renderRoundHist(gsi);
}

/* ---------- Project Replay GSI connection ---------- */
function connect() {
  let lastUpdate = 0;
  const waiting = $('waiting');
  const hud = $('hud');
  function consume(state) {
    lastUpdate = Date.now();
    const gsi = state && state.gsi;
    const usable = !!(state && state.fresh && gsi && gsi.map);
    hud.style.visibility = usable && state.visible !== false ? 'visible' : 'hidden';
    waiting.classList.toggle('hidden', usable);
    if (!usable) return;
    try {
      render(gsi);
      document.body.dataset.replayGsi = 'connected';
      document.body.dataset.replayPlayers = String(Object.keys(gsi.allplayers || {}).length);
    } catch (error) {
      document.body.dataset.replayGsi = 'render-error';
      console.error('Replay HUD render failed', error);
      hud.style.visibility = 'hidden';
      waiting.classList.remove('hidden');
    }
  }
  window.addEventListener('replay-hud', event => consume(event.detail));
  if (window.ReplayHUD && window.ReplayHUD.state) consume(window.ReplayHUD.state);
  else hud.style.visibility = 'hidden';
  setInterval(() => {
    if (Date.now() - lastUpdate > 3000) {
      hud.style.visibility = 'hidden';
      waiting.classList.remove('hidden');
      document.body.dataset.replayGsi = 'disconnected';
    }
  }, 500);
}

/* ---------- Layout editor & custom layout ---------- */
const EDITABLE = ['topbar', 'mapstrip', 'players-left', 'players-right', 'obsplayer', 'fz-ct', 'fz-t', 'roundhist', 'radar', 'bombbar', 'timeout', 'roundbanner', 'clutch-ct', 'clutch-t'];
const LAYOUT_KEY = 'astra-hud-layout-v2';
const IS_EDIT = location.hash === '#edit' || new URLSearchParams(location.search).has('edit');
const IS_RADAR = location.hash === '#radar' || new URLSearchParams(location.search).has('radar');
// Layout variant: ?layout=bottom switches the side player columns to a bottom row of
// square cards (used by the astra-bottom thin loader, which redirects here with
// hud=astra-bottom&layout=bottom added to the query).
if (new URLSearchParams(location.search).get('layout') === 'bottom') document.body.classList.add('layout-bottom');
// Layout is stored server-side so every view of this HUD (overlay editor AND
// OBS browser source, which has its own localStorage) shares the same layout.
// The ?hud= query param lets thin-loader variants (e.g. astra-bottom) keep their
// own layout storage instead of sharing the directory-derived HUD id.
const HUD_ID = new URLSearchParams(location.search).get('hud') || (location.pathname.match(/\/huds\/([^/]+)\//) || [])[1] || 'astra-default';
let serverLayout = null; // authoritative copy fetched from /api/hud-layout

function getLayout() {
  if (serverLayout) return serverLayout;
  try { return JSON.parse(localStorage.getItem(LAYOUT_KEY) || '{}'); } catch (e) { return {}; }
}
let layoutPostTimer = null;
function saveLayout(l) {
  serverLayout = l;
  try { localStorage.setItem(LAYOUT_KEY, JSON.stringify(l)); } catch (e) {}
  clearTimeout(layoutPostTimer);
  layoutPostTimer = setTimeout(() => {
    fetch('/api/hud-layout/' + HUD_ID, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(l)
    }).catch(() => {});
  }, 250);
}
async function loadServerLayout() { /* Keep the packaged layout in Replay. */ }

function designRect(el) {
  const hudRect = $('hud').getBoundingClientRect();
  const r = el.getBoundingClientRect();
  return { x: (r.left - hudRect.left) / hudScale, y: (r.top - hudRect.top) / hudScale, w: r.width / hudScale, h: r.height / hudScale };
}

// NOTE: elements without a saved layout entry keep their pure CSS anchors
// (bottom/right/translateX(-50%) etc.) — always correct at any render timing.
// Conversion to explicit left/top happens lazily in normalizeEl() on first drag.
function applySavedLayout() {
  const saved = getLayout();
  for (const id of EDITABLE) {
    const l = saved[id];
    const el = $(id);
    if (!l || !el) continue;
    el.style.right = 'auto'; el.style.bottom = 'auto';
    el.style.transformOrigin = 'top left';
    el.style.left = l.x + 'px';
    el.style.top = l.y + 'px';
    el.style.transform = l.s && l.s !== 1 ? 'scale(' + l.s + ')' : 'none';
    el.dataset.norm = '1'; // skip editing-mode anchor overrides (#roundhist translate etc.)
  }
}

// On first drag of a part that was hidden at init (still has CSS anchors like
// translateX(-50%)), convert its measured position to explicit left/top so it
// doesn't jump when the drag writes inline styles.
function normalizeEl(el) {
  if (el.dataset.norm) return;
  const r = designRect(el);
  el.style.right = 'auto'; el.style.bottom = 'auto';
  el.style.transform = 'none';
  el.style.transformOrigin = 'top left';
  el.style.left = r.x + 'px';
  el.style.top = r.y + 'px';
  el.dataset.norm = '1';
}
